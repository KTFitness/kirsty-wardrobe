<style>
/* Layout: a phone-first closet. Sticky header, one scrolling view per tab, bottom tab bar. Items sit on tiles like garments on a rail. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --tile:#eef0ec; --fg:#1d2430; --muted:#5d6878; --line:#dbe1ea;
  --tomato:#d8392f; --sky:#9cc3e6; --mint:#86c79c; --pink:#f2a7c3; --butter:#f3de8a;
  --accent:#d8392f; --accent-fg:#ffffff;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Rethink Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141922; --surface:#1d2430; --tile:#2a3240; --fg:#eef1f6; --muted:#a3adbc; --line:#2e3746;
  --tomato:#ff6b5f; --sky:#8fb9e0; --mint:#7fc497; --pink:#f0a7c0; --butter:#e9d27c;
  --accent:#ff6b5f; --accent-fg:#141922; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-block:12px 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1}
header.top .sub{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
header.top .upd{font-size:12px;color:var(--muted);text-align:right}
main{max-width:980px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:18px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--butter);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;cursor:pointer;text-align:left;padding:0}
.tile{background:var(--tile);aspect-ratio:4/5;display:grid;place-items:center;max-width:100%;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:contain;padding:8px;display:block}
.card .meta{padding:9px 11px 11px;display:grid;gap:2px;min-width:0}
.card .nm{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ct{font-size:12px;color:var(--muted)}
.btn{border:none;border-radius:10px;padding:10px 15px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--tomato);border:1px solid var(--tomato)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px 18px;color:var(--muted);text-align:center;display:grid;gap:6px}
.empty strong{color:var(--fg);font-weight:600}
.pairwith{display:grid;gap:6px;font-size:14px;font-weight:600}
.pairwith select,.pairwith input{font:inherit;font-weight:400;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.wx{display:flex;gap:12px;align-items:center;margin-top:6px;font-size:14px}
.wxt{font-family:var(--display);font-size:30px;line-height:1;min-width:52px}
.minigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;padding:8px 0 4px}
.minigrid.three{grid-template-columns:repeat(3,1fr)}
.mini{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:0;color:var(--fg)}
.mini span{font-size:11.5px;line-height:1.25;padding:5px 7px 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.catsec{margin:0 0 10px}
.cathead .chosen{display:flex;gap:3px}.cathead .chosen img{width:30px;height:30px;object-fit:contain;background:var(--surface);border-radius:6px}
.cathead{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--tile);border-radius:12px;margin:0 0 8px}
.cathead .gn{flex:1;font-family:var(--display);font-size:18px}
.cathead .chev{color:var(--muted)}
.cathead .n{font-size:12px;color:var(--muted);background:var(--surface);border-radius:99px;padding:2px 8px;font-weight:600}
.catsec .grp{margin-left:10px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;padding:0 10px}
.grphead{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer}
.grphead img{width:42px;height:42px;object-fit:contain;background:var(--tile);border-radius:8px}
.grphead .gn{flex:1;font-weight:600;font-size:14.5px;line-height:1.25}
.grphead .chev{color:var(--muted);font-size:13px}
h3 .n,.grphead .n{font-size:12px;color:var(--muted);background:var(--tile);border-radius:99px;padding:2px 8px;font-weight:600}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.collage{background:var(--tile);position:relative;width:100%;max-width:100%}
.collage::before{content:"";display:block;padding-top:100%}
.collage .cin{position:absolute;top:8px;left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:2fr 1fr;gap:4px}
.collage.solo .cin{grid-template-columns:1fr}
.mini .collage .cin{top:4px;left:4px;right:4px;bottom:4px;gap:2px}
.collage{overflow:hidden}
.collage .main,.collage .side{display:grid;gap:4px;min-height:0;min-width:0;overflow:hidden}
.collage .cl{position:relative;min-height:0;min-width:0;overflow:hidden}
.collage .cl.hero{background:rgba(255,255,255,.35);border-radius:6px}
@media (prefers-color-scheme:dark){.collage .cl.hero{background:rgba(255,255,255,.07)}}
.collage img{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:contain;display:block}
.collage .gone{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.ocard .meta{padding:11px 13px 13px;display:grid;gap:7px}
.ocard .nm{font-family:var(--display);font-size:18px;line-height:1.2}
.ocard .why{font-size:13px;color:var(--muted);margin:0}
.ocard .tip{font-size:12.5px;margin:0;padding:6px 9px;border-radius:8px;background:var(--tile)}
.guides{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:0 0 22px}
.guides figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.guides img{width:100%;display:block}
.guides figcaption{padding:9px 12px;font-size:13px;color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--tile);color:var(--muted)}
.tag.mine{background:transparent;border:1px solid var(--line)}
.fav{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.fav[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#1d2430}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f select,label.f textarea{font:inherit;font-weight:400;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0}
.tripcard{display:grid;gap:8px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tripstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dayhead{margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
.pack{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.pack label{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0}
.pack img{width:40px;height:40px;object-fit:contain;background:var(--tile);border-radius:6px}
.pack input:checked~span{text-decoration:line-through;color:var(--muted)}
.lookf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f input{font-weight:400;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:500;color:var(--fg);cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--accent)}
.status{font-size:14px;color:var(--muted)}
.preview{background:var(--tile);border-radius:12px;max-height:360px;display:grid;place-items:center;overflow:hidden}
.preview img{max-height:360px;max-width:100%;object-fit:contain;display:block}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.facts dt{color:var(--muted);font-weight:600}
dl.facts dd{margin:0}
.missing{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.missing li{margin:2px 0}.wadd{border:none;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0 0 0 6px}
.wish{display:grid;gap:8px;margin:0;padding:0;list-style:none}.wish li{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.wish .wt{font-weight:600}.wish .wn{color:var(--muted);font-size:14px;white-space:pre-wrap}.wish.got .wt{text-decoration:line-through;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.iph{position:relative;padding-top:100%;background:var(--tile);border-radius:8px;overflow:hidden;cursor:zoom-in}
.iph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:block}
.iph span{position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px}
.bigimg{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;border-radius:10px;background:var(--tile)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:max(8px, env(safe-area-inset-bottom, 0px));padding-top:6px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:none;background:none;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:3px}
nav.tabs button .dot{width:22px;height:4px;border-radius:2px;background:transparent}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] .dot{background:var(--accent)}
dialog.sheet{border:none;padding:0;background:var(--surface);color:var(--fg);width:min(640px,100%);max-width:100%;max-height:92vh;border-radius:16px 16px 0 0;margin:auto auto 0;overflow:auto}
@media (min-width:700px){dialog.sheet{border-radius:16px;margin:auto}}
dialog.sheet::backdrop{background:rgba(10,14,20,.55)}
.sheet-in{padding:16px max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:grid;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.pick{position:relative}
.pick[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
.pick[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;background:var(--accent);color:var(--accent-fg);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card:active{transform:scale(.98)}.card{transition:transform .15s ease}}
</style>
</head>

<script>
/* Home-screen apps hold on to old copies. On open, check version.txt; if a newer version is live, refresh the cached files and reload once. */
const APPV="202610291106";
fetch("version.txt",{cache:"no-store"}).then(r=>r.ok?r.text():"").then(v=>{v=v.trim();if(!v||v===APPV)return;
  let tried="";try{tried=sessionStorage.getItem("kw:upd")||"";}catch(e){}if(tried===v)return;try{sessionStorage.setItem("kw:upd",v);}catch(e){}
  Promise.all([fetch("index.html",{cache:"reload"}),fetch("./",{cache:"reload"})]).catch(()=>{}).then(()=>location.reload());}).catch(()=>{});
</script>
<script>
const CATS=[["tops","Tops"],["knitwear","Knitwear"],["dresses","Dresses"],["playsuits","Playsuits & jumpsuits"],["skirts","Skirts"],["jeans","Jeans"],["trousers","Trousers"],["shorts","Shorts"],["outerwear","Outerwear"],["shoes","Shoes"],["bags","Bags"],["accessories","Accessories"]];
const CATNAME=Object.fromEntries(CATS);
const dcat=i=>!i?"other":i.category==="trousers"&&/jean/.test((i.id+" "+i.name).toLowerCase())?"jeans":i.category==="knitwear"&&/cardigan/.test((i.id+" "+i.name).toLowerCase())?"outerwear":i.category==="dresses"&&/playsuit|jumpsuit/.test((i.id+" "+i.name).toLowerCase())?"playsuits":i.category;
const SEASONS=["Spring","Summer","Autumn","Winter"];
const TOPS=["tops","knitwear"],BOTTOMS=["skirts","trousers","shorts"];
const D={items:[],outfits:[],inspo:[],occasions:[],updated:""};
const S={anchor:null,sOcc:"Everyday",sSeason:null,seed:1,pickCat:"all",q:"",tab:"outfits",cat:"all",sort:"colour",occ:"all",season:"any",surprise:null,build:{itemIds:[],name:"",occasions:[]},copied:""};

/* phone-only storage: favourites, hidden outfits, outfits built here */
let DV=0;
const memo=(fn)=>{let k=-1,v;return ()=>{const sg=DV+"|"+D.items.length+"|"+D.outfits.length+"|"+D.inspo.length;if(sg!==k){v=fn();k=sg;}return v;};};
const LS={get(k,d){try{const v=localStorage.getItem("kw:"+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){DV++;try{localStorage.setItem("kw:"+k,JSON.stringify(v));}catch(e){}}};
let taste=LS.get("taste",{w:{},n:0,liked:[],disliked:[]}),useRules=LS.get("useRules",false);
let fin=LS.get("finish",{}),unliked=LS.get("unliked",[]),favs=LS.get("favs",[]),hidden=LS.get("hidden",[]),mine=LS.get("mine",[]),gone=LS.get("gone",[]),inspoGone=LS.get("inspoGone",[]),inspoEdits=LS.get("inspoEdits",{}),wish=LS.get("wish",[]);
S.sort=LS.get("sort","colour");
let trips=LS.get("trips",[]);S.isort=LS.get("isort","new");
function saveTrips(t){if(t)t.updated=Date.now();LS.set("trips",trips);}
let IDX=new Map();
function applyGone(){D.items=(D.all||[]).filter(i=>!gone.includes(i.id));IDX=new Map(D.items.map(i=>[i.id,i]));DV++;}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const ALIAS={"basic-tan-sandals":"basic-tan-flats","basic-white-tank":"zara-white-sleeveless-knit","basic-black-tank":"zara-black-sleeveless-knit"};
const byId=id=>IDX.get(ALIAS[id]||id);
const th=src=>/^img\/(?!basics\/).*\.webp$/.test(src||"")?"img/t/"+src.slice(4):src;
const WX_CODES={0:"sunny",1:"mostly sunny",2:"partly cloudy",3:"cloudy",45:"foggy",48:"foggy",51:"drizzle",53:"drizzle",55:"drizzle",61:"light rain",63:"rain",65:"heavy rain",80:"showers",81:"showers",82:"heavy showers",95:"storms",96:"storms",99:"storms"};
function wxSeason(w){const t=w.max;return t>=26?"Summer":t>=20?"Spring":t>=15?"Autumn":"Winter";}
function todaySeason(){return S.wx?wxSeason(S.wx):currentSeason();}
function wxRain(){return !!(S.wx&&(S.wx.rain>=50||[51,53,55,61,63,65,80,81,82,95,96,99].includes(S.wx.code)));}
function wxLine(){if(!S.wx)return "";const w=S.wx;const d=WX_CODES[w.code]||"";const feel={Summer:"a hot day",Spring:"a warm day",Autumn:"a mild day",Winter:"a cool day"}[wxSeason(w)];
  return `<div class="wx"><span class="wxt">${Math.round(w.max)}°</span><span>Today in West Beach: ${esc(d)}, ${Math.round(w.min)} to ${Math.round(w.max)}°C${w.rain>=30?`, ${w.rain}% chance of rain`:""}.<br><span class="lede" style="font-size:13px">Showing pieces for ${feel}${wxRain()?", with a layer and closed shoes for the rain":""}.</span></span></div>`;}
function loadWx(){try{const c=JSON.parse(localStorage.getItem("kw:wx")||"null");if(c&&c.day===new Date().toDateString()){S.wx=c;}}catch(e){}
  if(S.wx)return;fetch("https://api.open-meteo.com/v1/forecast?latitude=-34.95&longitude=138.50&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Australia%2FAdelaide&forecast_days=1")
  .then(r=>r.json()).then(j=>{const d=j.daily;S.wx={day:new Date().toDateString(),max:d.temperature_2m_max[0],min:d.temperature_2m_min[0],rain:d.precipitation_probability_max[0]||0,code:d.weather_code[0]};try{localStorage.setItem("kw:wx",JSON.stringify(S.wx));}catch(e){}render();}).catch(()=>{});}
function currentSeason(){const m=new Date().getMonth();return m===11||m<2?"Summer":m<5?"Autumn":m<8?"Winter":"Spring";}
const okey=o=>(o.itemIds||[]).map(id=>ALIAS[id]||id).sort().join(",");
const ACC=["shoes","bags","accessories"];
const ckey=o=>(o.itemIds||[]).map(id=>ALIAS[id]||id).filter(id=>{const it=byId(id);return it&&!ACC.includes(it.category);}).sort().join(",");
const applyFin=o=>{const f=fin[o.id];if(!f)return o;let ids=(o.itemIds||[]).filter(id=>{const it=byId(id);return !(it&&((f.shoes!==undefined&&it.category==="shoes")||(f.bag!==undefined&&it.category==="bags")));});if(f.shoes)ids.push(f.shoes);if(f.bag)ids.push(f.bag);return {...o,itemIds:ids};};
const allOutfits=memo(()=>{const L=mine.map(o=>({...o,mine:true})).concat(D.outfits.map(o=>({...o,mine:false})));const seen=new Set(),out=[];
  for(const o of L){if((o.itemIds||[]).some(id=>gone.includes(id)))continue;const liked=o.mine||o.liked;if(liked){const k=ckey(o);if(seen.has(k))continue;seen.add(k);}out.push(applyFin(o));}
  return out.filter(o=>!o.mine).filter(o=>!o.liked).concat(out.filter(o=>o.liked&&!o.mine),out.filter(o=>o.mine));});

function inspoBtns(o,liked){return (liked?`<span class="fav" aria-pressed="true" style="cursor:default">♥ Liked</span>`:`<button class="fav" type="button" data-likeinsp="${esc(o.inspoId)}" aria-pressed="false">♡ Like</button>`)+`<button class="iconbtn" type="button" data-swapinsp="${esc(o.inspoId)}">Swap a piece</button>`;}
function collage(ids,hero){
  const order=["outerwear","tops","knitwear","dresses","skirts","trousers","shorts"],body=["tops","knitwear","dresses","skirts","trousers","shorts"];
  const items=ids.map(byId);let H=hero?items.find(it=>it&&it.id===(ALIAS[hero]||hero)):null;
  if(H&&["shoes","bags","accessories"].includes(H.category)===false&&!body.includes(H.category)&&H.category!=="outerwear")H=null;
  const main=[],side=[];
  items.forEach(it=>{if(it===H)return;if(!it){main.push(null);return;}(body.includes(it.category)?main:side).push(it);});
  main.sort((a,b)=>(a?order.indexOf(a.category):9)-(b?order.indexOf(b.category):9));
  if(H&&["shoes","bags","accessories"].includes(H.category)){side.unshift(H);H=null;}
  const cell=(it,big)=>`<div class="cl${big?" hero":""}">${it?`<img src="${esc(th(it.img))}" alt="${esc(it.name)}" loading="lazy">`:`<div class="gone">Item no longer in wardrobe</div>`}</div>`;
  const mainCells=(H?[cell(H,true)]:[]).concat(main.map(x=>cell(x)));
  const rows=(H?["2fr"]:[]).concat(main.map(()=>"1fr")).join(" ")||"1fr";
  const mainHtml=`<div class="main" style="grid-template-rows:${rows}">${mainCells.join("")}</div>`;
  if(!side.length)return `<div class="collage solo"><div class="cin">${mainHtml}</div></div>`;
  return `<div class="collage"><div class="cin">${mainHtml}<div class="side" style="grid-template-rows:repeat(${side.length},1fr)">${side.map(x=>cell(x)).join("")}</div></div></div>`;
}

const COL_ORDER=["white","cream","tan","brown","grey","black","denim","navy","blue","sky","lilac","pink","red","coral","orange","yellow","green","mint","forest","multi"];
const PAT_ORDER=[null,"stripe","check","dot","floral","print","animal"];
function itxt(i){return (i.name+" "+(i.notes||"").replace(/(picture|stand-in photo|your photo)[^.]*\./gi,"")+" "+(i.shape||"")).toLowerCase();}
function colRank(i){const f=(window.Stylist?Stylist.families(i):[])[0];const k=COL_ORDER.indexOf(f);return k<0?COL_ORDER.length:k;}
function patRank(i){const k=PAT_ORDER.indexOf(window.Stylist?Stylist.pkind(i):null);return k<0?PAT_ORDER.length:k;}
function lenRank(i){const t=itxt(i),c=i.category;
  if(["tops","knitwear","outerwear"].includes(c)){
    const nm=i.name.toLowerCase();
    if(/sleeveless/.test(t)||/tank|halter|vest|cami|bustier|crop top/.test(nm))return 0;
    if(/three-quarter|3\/4|elbow/.test(t))return 2;
    if(/long-sleeve|long sleeve|long balloon|turtleneck|jumper|cardigan|sweat|funnel|blazer|jacket|coat/.test(t)||c==="outerwear")return 3;
    return 1;}
  if(c==="shorts")return 0;
  if(/mini/.test(t))return 1;
  if(/knee/.test(t))return 2;
  if(/midi/.test(t))return 3;
  if(/crop|ankle|above ankle|widecrop/.test(t))return 4;
  if(/maxi|full length|full-length|leggings/.test(t)||c==="trousers")return 5;
  return 3;}
const SORTS={colour:[colRank,lenRank,patRank],length:[lenRank,colRank,patRank],pattern:[patRank,colRank,lenRank]};
function arrange(list){const fs=SORTS[S.sort]||SORTS.colour;const ci=i=>CATS.findIndex(c=>c[0]===dcat(i));
  const K=new Map(list.map(i=>[i,[ci(i),fs[0](i),fs[1](i),fs[2](i)]]));
  return list.slice().sort((a,b)=>{const x=K.get(a),y=K.get(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]||x[3]-y[3]||(a.name<b.name?-1:a.name>b.name?1:0);});}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function isBuilt(o){return !o.temp&&!!(o.built||(o.mine&&o.why===""));}
function isLiked(o){if(o.temp)return false;return !!(o.mine||(o.liked&&!unliked.includes(o.id))||favs.includes(o.id));}
function keyPiece(o){const P=(o.itemIds||[]).map(byId).filter(Boolean);
  return P.find(i=>i.category==="dresses")||P.find(i=>!i.basic&&["skirts","trousers","shorts"].includes(i.category))||P.find(i=>["skirts","trousers","shorts"].includes(i.category))||P.find(i=>!["shoes","bags","accessories"].includes(i.category))||P[0];}
function topOf(o,k){const P=(o.itemIds||[]).map(byId).filter(Boolean);return P.find(i=>i!==k&&!i.basic&&["tops","knitwear"].includes(i.category))||P.find(i=>i!==k&&["tops","knitwear","outerwear"].includes(i.category));}
function fitsSeason(o,se){return (o.itemIds||[]).every(id=>{const it=byId(id);return !it||!it.seasons||!it.seasons.length||it.seasons.includes(se);});}
function other(o,k){const P=(o.itemIds||[]).map(byId).filter(i=>i&&i!==k&&!ACC.includes(i.category));const bot=["skirts","trousers","shorts","dresses"];return ["tops","knitwear","outerwear"].includes(k&&k.category)?(P.find(i=>bot.includes(i.category))||P[0]):(topOf(o,k)||P[0]);}

/* Trips: outfits saved for a trip or a run of events, grouped by day, with a packing list. */
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDay=s=>new Date(s+"T00:00:00").toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
function tripDays(t){if(!t.start)return [];const out=[],d=new Date(t.start+"T00:00:00"),e=new Date((t.end&&t.end>=t.start?t.end:t.start)+"T00:00:00");while(d<=e&&out.length<31){out.push(isoD(d));d.setDate(d.getDate()+1);}return out;}
function tripDates(t){if(!t.start)return "No dates yet";return t.end&&t.end!==t.start?fmtDay(t.start)+" to "+fmtDay(t.end):fmtDay(t.start);}
const tripById=id=>trips.find(t=>t.id===id);

function lookCard(t,l,days){

   <div class="row"><button class="iconbtn" type="button" id="tCopyPack">${S.copied==="pack"?"Copied":"Copy packing list"}</button></div></section>`:""}`;

function surprise(){
  const season=S.season==="any"?todaySeason():S.season;
  const ok=i=>!i.seasons||!i.seasons.length||i.seasons.includes(season);
  const pool=D.items.filter(i=>["tops","dresses","skirts","trousers","shorts"].includes(i.category)&&ok(i));
  const ex=allDisliked().concat(ratingLists().liked).map(k=>Stylist.coreKey(k.split(",").map(byId).filter(Boolean)));
  let r=null;for(let t=0;t<8&&!r;t++){const a=pool[Math.floor(Math.random()*pool.length)];if(!a)break;
    const res=Stylist.suggest(a,D.items,{occ:"Everyday",season,seed:Math.floor(Math.random()*1e6),count:3,W:tasteW(),n:tasteN(),noAccessories:true,excludeCore:ex});
    if(res.length)r=res[Math.floor(Math.random()*res.length)];}
  if(!r){S.surprise=null;return;}
  const P=r.pieces.slice();const f=Stylist.finish(P,D.items,{occ:"Everyday",season,W:tasteW()});if(f.shoes[0])P.push(f.shoes[0]);if(f.bags[0])P.push(f.bags[0]);
  S.surprise={id:"s"+Date.now(),name:"Something new to try",itemIds:P.map(p=>p.id),occasions:["Everyday"],why:"A combination you haven't rated yet, picked using your taste.",temp:true};
}
